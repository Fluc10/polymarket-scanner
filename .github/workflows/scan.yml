name: Polymarket Scan

on:
  schedule:
    # Alle 6 Stunden (Zeiten in UTC). Anpassen nach Wunsch.
    - cron: "17 */6 * * *"
  workflow_dispatch:   # Manuell starten über "Run workflow"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scanner ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACTICITY_API_KEY: ${{ secrets.FACTICITY_API_KEY }}
          MIN_VOLUME: ${{ vars.MIN_VOLUME || '10000' }}
          MAX_VOLUME: ${{ vars.MAX_VOLUME || '200000' }}
          MAX_INSIGHTS: ${{ vars.MAX_INSIGHTS || '20' }}
          MAX_NEW_GENERATIONS: ${{ vars.MAX_NEW_GENERATIONS || '5' }}
          ANALYZE_MODE: ${{ vars.ANALYZE_MODE || 'top' }}
          WAIT_MINUTES: ${{ vars.WAIT_MINUTES || '10' }}
          USE_FEED: ${{ vars.USE_FEED || 'true' }}
        run: python scanner.py

      - name: Ergebnisse als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-scan
          path: |
            polymarket_scan.csv
            polymarket_scan.html
            araistotle_insights.csv
            araistotle_insights.html
          retention-days: 14
          if-no-files-found: ignore
