name: Polymarket Scan

on:
  schedule:
    # Einmal täglich um 07:43 UTC (= 08:43 Wiener Winterzeit). Anpassen nach Wunsch.
    - cron: "43 7 * * *"
  workflow_dispatch:   # Manuell starten über "Run workflow"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scanner ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_N: ${{ vars.TOP_N || '20' }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '0' }}
          PRICE_MIN: ${{ vars.PRICE_MIN || '0.05' }}
          PRICE_MAX: ${{ vars.PRICE_MAX || '0.95' }}
          MIN_LIQUIDITY: ${{ vars.MIN_LIQUIDITY || '5000' }}
          MIN_MARKET_VOLUME: ${{ vars.MIN_MARKET_VOLUME || '2000' }}
          MIN_DAYS_LEFT: ${{ vars.MIN_DAYS_LEFT || '3' }}
          MAX_DAYS_LEFT: ${{ vars.MAX_DAYS_LEFT || '120' }}
          EXCLUDE_TAGS: ${{ vars.EXCLUDE_TAGS }}
        run: python scanner.py

      - name: Ergebnisse als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-scan
          path: |
            polymarket_scan.csv
            polymarket_scan.html
          retention-days: 14
          if-no-files-found: ignore
