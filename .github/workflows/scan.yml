name: Polymarket Scan

on:
  schedule:
    # Alle 6 Stunden (Zeiten in UTC). Anpassen nach Wunsch.
    - cron: "17 */6 * * *"
  workflow_dispatch:   # Manuell starten über "Run workflow"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scanner ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_VOLUME: ${{ vars.MIN_VOLUME || '10000' }}
          MAX_VOLUME: ${{ vars.MAX_VOLUME || '200000' }}
          MIN_VOLUME_24H: ${{ vars.MIN_VOLUME_24H || '1000' }}
          MAX_VOLUME_24H: ${{ vars.MAX_VOLUME_24H || '0' }}
        run: python scanner.py

      - name: Ergebnisse als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-scan
          path: |
            polymarket_scan.csv
            polymarket_scan.html
          retention-days: 14
          if-no-files-found: ignore
