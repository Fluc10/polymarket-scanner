name: Neue Märkte

on:
  schedule:
    - cron: "27 * * * *"   # stündlich zur Minute 27
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Zustand laden
        uses: actions/cache@v4
        with:
          path: .state
          key: new-markets-state-${{ github.run_id }}
          restore-keys: new-markets-state-

      - name: Neue Märkte prüfen + Exa- und ArAIstotle-Analyse + Google Sheet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FACTICITY_API_KEY: ${{ secrets.FACTICITY_API_KEY }}
          ARAISTOTLE_MAX_PER_RUN: ${{ vars.ARAISTOTLE_MAX_PER_RUN }}
          ARAISTOTLE_WAIT: ${{ vars.ARAISTOTLE_WAIT }}
          ARAISTOTLE_LOW_CREDITS: ${{ vars.ARAISTOTLE_LOW_CREDITS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          EXA_MAX_PER_RUN: ${{ vars.EXA_MAX_PER_RUN }}
          NEW_MIN_VOLUME: ${{ vars.NEW_MIN_VOLUME }}
          NEW_MAX_AGE_HOURS: ${{ vars.NEW_MAX_AGE_HOURS }}
          NEW_EXCLUDE_TAGS: ${{ vars.NEW_EXCLUDE_TAGS }}
          NEW_ESPORTS_MIN_VOLUME: ${{ vars.NEW_ESPORTS_MIN_VOLUME }}
          NEW_ESPORTS_MAX_AGE_HOURS: ${{ vars.NEW_ESPORTS_MAX_AGE_HOURS }}
        run: python new_markets.py

      - name: Protokoll speichern
        run: |
          if [ -d data ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "Exa-Protokoll aktualisiert"
              git pull --rebase
              git push
            fi
          fi
