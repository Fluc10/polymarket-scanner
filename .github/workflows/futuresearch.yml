name: FutureSearch-Check

on:
  schedule:
    # 18 Uhr Wien = 17:07 UTC (Winter) bzw. 16:07 UTC (Sommer).
    # Beide Zeiten sind eingetragen, das Skript prüft nur einmal pro Tag ab 18 Uhr Wiener Zeit.
    - cron: "7 16 * * *"
    - cron: "7 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Sofort prüfen (unabhängig von Uhrzeit)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: futuresearch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt futuresearch

      - name: FutureSearch-Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUTURESEARCH_API_KEY: ${{ secrets.FUTURESEARCH_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          FS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || '' }}
          FS_PER_DAY: ${{ vars.FS_PER_DAY || '2' }}
          FS_EFFORT: ${{ vars.FS_EFFORT || 'LOW' }}
          FS_MIN_BALANCE: ${{ vars.FS_MIN_BALANCE || '6' }}
        run: python futuresearch_check.py

      - name: Protokoll speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then echo "Nichts zu speichern"; exit 0; fi
          git commit -m "FutureSearch-Check $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
